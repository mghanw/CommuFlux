[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "commuflux"
version = "1.0.0"
description = "Spatial cell-cell communication as a joint entropic network flow through cell-specific intracellular networks"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.12,<2",
  "pandas>=2.2,<4",
  "networkx>=3.2,<4",
  "bitarray>=2.9",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
xenium = ["h5py>=3.9"]
test = ["pytest>=8"]

[project.scripts]
commuflux = "commuflux.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cscn = ["LICENSE", "VENDORED.md"]
dynamicTreeCut = ["LICENSE", "VENDORED.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
